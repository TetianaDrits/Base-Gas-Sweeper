<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><title>Base Sweeper</title>
<style>
  body { background: #111; color: #fff; font-family: sans-serif; text-align: center; }
  #board { display: grid; grid-template-columns: repeat(5, 50px); gap: 5px; justify-content: center; margin-top: 20px; }
  .cell { width: 50px; height: 50px; background: #222; border: 1px solid #0052FF; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; user-select: none; }
  .open { background: #333; }
</style>
</head>
<body>
<h1>Base Spam Sweeper</h1>
<p>Очисти блок от вредоносных спам-транзакций!</p>
<div id="board"></div>
<script>
  const size = 25, bombs = [3, 8, 14, 21];
  const board = document.getElementById('board');
  for(let i=0; i<size; i++) {
    const c = document.createElement('div');
    c.className = 'cell';
    c.onclick = () => {
      if(bombs.includes(i)) {
        c.style.background = '#ff4444'; c.innerText = '💣'; alert('Спам-атака! Блок заблокирован.'); location.reload();
      } else {
        c.classList.add('open');
        let count = bombs.filter(b => Math.abs(b - i) <= 6).length;
        c.innerText = count;
      }
    };
    board.appendChild(c);
  }
</script>
</body>
</html>
